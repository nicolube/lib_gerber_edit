[package]
name = "lib_gerber_edit"
description = "A libary for manipululating extended gerber data (RS-274X)"
repository = "https://github.com/nicolube/lib_gerber_edit"
license-file = "LICENSE"
version = "0.5.0"
edition = "2024"

[dependencies]
gerber_parser = "0.4.0"
lazy_static = "1.5"
log = "0.4"
derive_more = { version = "2.1.1", features = ["display", "error"]}
thiserror = "2.0"
serde = { version = "1.0.228", features = ["derive"], optional = true}
chrono = "0.4"
rayon = { version = "1", optional = true }

[features]
default = ["serde"]
serde = ["dep:serde"]
parallel = ["dep:rayon"]