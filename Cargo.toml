[package]
name = "lib_gerber_edit"
description = "A libary for manipululating extended gerber data (RS-274X)"
repository = "https://github.com/nicolube/lib_gerber_edit"
license-file = "LICENSE"
version = "0.1.0"
edition = "2024"

[dependencies]
gerber_parser = "0.4.0"
lazy_static = "1.5.0"
derive_more = { version = "2.1.1", features = ["display", "error"]}
thiserror = "2.0.16"
serde = { version = "1.0.228", features = ["derive"] }
chrono = "0.4.42"