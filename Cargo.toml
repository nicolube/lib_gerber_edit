[package]
name = "lib_gerber_edit"
description = "A library for manipulating extended Gerber (RS-274X) and Excellon drill data"
repository = "https://github.com/nicolube/lib_gerber_edit"
license-file = "LICENSE"
version = "0.7.0"
edition = "2024"

[dependencies]
gerber_parser = "0.5"
lazy_static = "1.5"
log = "0.4"
derive_more = { version = "2.1.1", features = ["display", "error"]}
thiserror = "2.0"
serde = { version = "1.0.228", features = ["derive"], optional = true}
chrono = "0.4"
rayon = { version = "1", optional = true }
winnow = "1.0"
i_overlay = "4.5"

[dev-dependencies]
tiny-skia = "0.12"

[features]
default = ["serde"]
serde = ["dep:serde"]
parallel = ["dep:rayon"]
